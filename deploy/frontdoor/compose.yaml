# The front door as a container of its own: for AFTER legacy's nginx is retired, when the container that
# publishes host port 8080 today (decimer_web-nginx-1) goes away with the legacy stack. Until then the front door is
# legacy's own container with this file's rendered config in it (deploy/cutover/cutover.sh) and this is unused.
# Same rendered file, same behaviour; the difference is that the container is ours, has `restart: unless-stopped`
# (legacy's has `on-failure`, which does not bring it back after a reboot) and does not depend on legacy's compose project.
#
# Not part of deploy/compose.yaml on purpose: the stack's `$DC down` must never take the public port with it, and
# this project does not own the network, it only joins the stack's `public` one.
#
#   cd /opt/decimer
#   deploy/frontdoor/render.sh > deploy/frontdoor/conf.d/default.conf        (mkdir -p deploy/frontdoor/conf.d first)
#   FD="docker compose -p decimer-frontdoor -f deploy/frontdoor/compose.yaml"
#   $FD config -q && $FD up -d            (needs host port 8080 free: stop decimer_web-nginx-1 first, a few seconds)
#
# FRONTDOOR_CONF_DIR (default ./conf.d next to this file) is where the rendered default.conf lives; the rehearsal uses a scratch one.
# The directory is mounted, not a single file, so an edit by `render.sh >` or by an editor that replaces the file
# reaches the container (a single-file bind mount keeps the old inode: the trap legacy's compose has).
# After a re-render: `docker exec decimer-frontdoor nginx -t && docker exec decimer-frontdoor nginx -s reload`.
services:
  frontdoor:
    # The nginx of the edge image (deploy/web.Dockerfile, NGINX_IMAGE): one pinned version for both.
    image: nginx:1.31.8-alpine3.24@sha256:1ef7ca94d7879df82421428ce13bd1eaa412404953859cf7a5b6512c25e67a60
    pull_policy: never
    container_name: decimer-frontdoor
    restart: unless-stopped
    ports:
      - "${FRONTDOOR_PORT:-8080}:80"
    volumes:
      - ${FRONTDOOR_CONF_DIR:-./conf.d}:/etc/nginx/conf.d:ro
    networks:
      - public
    # The whole chain up to the edge: unhealthy while the edge is down.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 1
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  public:
    # The stack's own network (compose.yaml: `public`, the edge alone), joined, never created or removed here.
    external: true
    name: ${EDGE_NETWORK:-decimer-next_public}
