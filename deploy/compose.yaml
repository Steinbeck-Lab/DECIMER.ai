# decimer.ai, new stack. Runs BESIDE the legacy stack on the production VM:
# a separate Compose project, so nothing here touches decimer_web-*.
#
#   DC="docker compose -p decimer-next -f deploy/compose.yaml --env-file deploy/.env"
#   $DC build && $DC up -d            # see deploy/README.md for the whole procedure
#
# Always pass the project name (-p decimer-next): it names the networks and volumes
# (decimer-next_public, decimer-next_jobs, ...) and keeps the project apart from the legacy one.
#
# Written for the Compose that `docker compose` runs on the VM: v2.3.3 (2022), from
# ~/.docker/cli-plugins, which shadows the system's v2.39.2 (/usr/libexec/docker/cli-plugins). So: no
# `name:`, no `!reset`, no `required: false`, no healthcheck start_interval here. The file parses with
# both (checked); deploy/README.md says how to run the newer one.
#
# Configuration: deploy/.env (copy deploy/.env.example; never committed; holds IP_HASH_SECRET and
# REDIS_PASSWORD). It is read twice: for ${VAR} below and, as env_file, into the api, worker and
# sweep containers, so every setting listed in api/README.md and .env.example can be set there without
# editing this file. Values given under `environment:` win over env_file.
#
# Model-service replicas. seg, ocsr and cls run as N identical containers each, N from deploy/.env
# (SEG_REPLICAS, OCSR_REPLICAS, CLS_REPLICAS; chem is always 1): 2/3/2 while legacy runs on the same VM
# (the default), 6/4/3 after cutover (legacy's layout plus one ocsr; D18 amended 2026-10-23). `deploy.replicas` is how: Compose creates N
# containers (decimer-next-seg-1 ... -N) and the SERVICE NAME resolves, on the `models` network, to the
# addresses of all of them (Docker's embedded DNS answers with every replica's A record, in rotating
# order). That is the whole discovery contract for the worker, and nothing else is promised:
#     SEG_URL=http://seg:8001   OCSR_URL=http://ocsr:8002   CLS_URL=http://cls:8003   CHEM_URL=http://chem:8004
# one hostname per service, one fixed port per service, all replicas answer on that port; the worker
# resolves all A records of the name (api/src/decimer_api/worker/replicas.py), looks again every 10 s and
# right after a connection failed (replicas restart and get new addresses), sends every call to the
# least-busy healthy replica and skips one that refuses connections for 10 s. Do not use per-replica
# names or addresses (the container names are not part of the contract), and no service that is scaled
# has a container_name or a published port (it would make a second replica impossible). Everything per
# replica (memory, cpus, pids, threads) is the same for all replicas of a service. Scaling by hand:
# `$DC up -d --scale seg=3` overrides the file for that run; the worker finds the third replica by itself.
#
# Networks (who can reach what)
#   public   the edge alone, with a pinned subnet and the only published ports (127.0.0.1:8090 for the site and
#            127.0.0.1:8091 for GlitchTip's UI, both on the host's loopback). Docker cannot publish a port from
#            an internal network, so this is the one network with a route out, and nothing but nginx is on it.
#            The legacy nginx can be attached to it for the beta (nginx/beta-front-door.conf.example); the edge
#            trusts this subnet's X-Forwarded-For (see TRUSTED_PROXY_CIDR below).
#   app      internal: edge + api, with a pinned subnet. The api sees the edge's address here, so this
#            subnet is the API's TRUSTED_PROXY_CIDR (derived from APP_SUBNET: one variable, no copy). The edge
#            and the api share NO other network: with two shared networks docker's DNS could answer `api` with
#            the address on the other one, and the api would no longer recognise its proxy.
#   backend  internal: redis, usage, api, worker, sweep.
#   models   internal: the worker and seg, cls, ocsr, chem. Only the worker calls them. The api is NOT
#            on it: the one model service it calls is chem (validate, export: IUPAC names of edited
#            structures), over the chem-api network.
#   chem-api internal: the api and chem, nothing else.
#   ingest   internal: the api and the ingest sidecar, nothing else: the sidecar parses uploads and
#            reads molfiles, so it has no route to Redis, chem, the edge, GlitchTip or the internet.
#   glitchtip-sdk   internal: api, worker, worker-fast and the `glitchtip-gate`: where the Python SDKs report to.
#                   GlitchTip itself is NOT on it, so a compromised api or worker reaches one endpoint of GlitchTip
#                   (POST of an envelope, through the gate) and not its login, its API or its admin.
#   glitchtip-edge  internal: the edge, the gate and GlitchTip: the browsers' reports (the edge passes one
#                   endpoint) and the operator's UI listener.
#   glitchtip-db    internal: GlitchTip and its Postgres.
#   There is no network with egress for the api or worker: error reports go to GlitchTip on this VM, so nothing
#   needs one. (GlitchTip's alert e-mails would: it sends none, `EMAIL_URL=consolemail://`; see deploy/README.md.)

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# No `init: true` for the api: it must be PID 1 itself (see api.Dockerfile). The sweep has it (below).
# oom_score_adj 300: if the VM ever runs out of memory, the kernel takes the new stack before legacy.
# That is the container; the ingest and render CHILDREN would need to lower their own score in code
# (TODO, API side: write 1000 to /proc/self/oom_score_adj; compose cannot set it per process).
# cpu_shares 512: half the default weight (1024) of the legacy container. The `cpus` limits below cap each
# container but are not reservations, and they sum to more than the 8 cores (deploy/README.md, "Threads and
# CPU"); the weight decides who gets the CPU when both stacks want it at once, in legacy's favour. It is
# per container, so it shifts the split, it does not make legacy win against every new container together.
x-service: &service
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  oom_score_adj: 300
  cpu_shares: 512

# The TensorFlow services and chem: no network but `models`, read-only root file system with a
# RAM-backed /tmp (TensorFlow and Keras write small files there; HOME is /tmp). Not read_only-proof
# yet: if one of them stops with "Read-only file system", add the path to tmpfs rather than dropping
# read_only; if it cannot be fixed that way, drop read_only for that service and write down why.
x-model-service: &model-service
  <<: *service
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  networks:
    - models
  oom_score_adj: 500

# redis and usage: the same image and password, the `redis` user, a read-only root file system, `backend` only
# (see `redis` below).
x-redis: &redis
  <<: *service
  image: redis:8.10.2-alpine3.23@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
  user: redis
  environment:
    REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env (openssl rand -hex 24)}
    REDISCLI_AUTH: ${REDIS_PASSWORD}
  read_only: true
  networks:
    - backend

# api, worker, sweep: one image (api.Dockerfile), three commands. Only the api has a build section.
# pull_policy: never on every image this project builds, and a localhost/ name: nothing here is ever
# pulled, and there is no Docker Hub namespace (decimer-next/...) that somebody else could own and that
# a missing image would be fetched from. Build first ($DC build), then up. (`pull_policy: build` would
# rebuild on every `up`, which also overwrites the tag a rollback is about to go back to.)
x-api-image: &api-image
  image: localhost/decimer-next/api:${DECIMER_TAG:-local}
  pull_policy: never

# What the api and both workers share about observability. SENTRY_DSN itself is in deploy/.env
# (env_file; empty = no error reports) and names GlitchTip on the glitchtip-sdk network. The usage counter keeps
# the per-day counts (jobs, pages, structures, failures: no address, no job id) in a Redis of its own, `usage`,
# because the jobs' Redis keeps nothing across a restart: `docker compose exec api python -m decimer_api.usage`.
x-reporting-env: &reporting-env
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELEASE: ${DECIMER_TAG:-local}
  USAGE_REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env (openssl rand -hex 24)}@usage:6379/0

# env_file hands the whole of deploy/.env to api, worker, sweep and ingest, GlitchTip's secrets included. They are
# GlitchTip's alone (its Django key and its Postgres password), so every service with an env_file blanks them
# (deploy/check-compose.py checks that none is missed).
x-no-glitchtip-secrets: &no-glitchtip-secrets
  GLITCHTIP_SECRET_KEY: ""
  GLITCHTIP_DB_PASSWORD: ""
  GLITCHTIP_ADMIN_PASSWORD: ""

# What the two workers (worker, worker-fast) have in common. SEG/OCSR/CLS_CONCURRENCY are PER REPLICA:
# the worker finds the replicas of a service by itself (see the header) and multiplies, so 1 keeps every
# replica busy with one inference at a time and does not fill its queue, whether the layout is 2/3/2
# or 6/4/3. They do NOT follow the replica counts any more; leave them at 1 unless a replica is shown to
# have idle time with one call (the services queue a few more, ocsr 16, seg 8). A lone 10-page job then
# takes about 70 s beside legacy and 46 s after cutover (deploy/README.md), legacy 95.3 s.
x-worker-env: &worker-env
  <<: [*reporting-env, *no-glitchtip-secrets]
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env (openssl rand -hex 24)}@redis:6379/0
  DATA_DIR: /data/jobs
  # The discovery contract (see the header): hostname + fixed port, one name per service; the worker
  # resolves every A record of the name.
  SEG_URL: http://seg:8001
  OCSR_URL: http://ocsr:8002
  CLS_URL: http://cls:8003
  # `-` and not `:-`: the default applies only when CHEM_URL is unset, so `CHEM_URL=` in .env really is
  # empty, which switches names off.
  CHEM_URL: ${CHEM_URL-http://chem:8004}
  # D4 (kept): the SMILES RDKit refuses go to chem's POST /cdk, one batch per job (needs CHEM_URL). `false` = no call.
  CDK_FALLBACK: ${CDK_FALLBACK:-true}
  # One pasted image, one structure covering at least this fraction of it: the whole image goes to ocsr and cls.
  SINGLE_IMAGE_WHOLE_FRACTION: ${SINGLE_IMAGE_WHOLE_FRACTION:-0.6}
  SEG_CONCURRENCY: ${SEG_CONCURRENCY:-1}
  OCSR_CONCURRENCY: ${OCSR_CONCURRENCY:-1}
  CLS_CONCURRENCY: ${CLS_CONCURRENCY:-1}
  CHEM_CONCURRENCY: ${CHEM_CONCURRENCY:-1}
  RENDER_CONCURRENCY: ${RENDER_CONCURRENCY:-1}
  # The hashing key belongs to the api alone (env_file would hand it to every container).
  IP_HASH_SECRET: ""
  # arq waits this long for running jobs when it is stopped (0 would cancel them; they rerun after
  # the restart). stop_grace_period must be longer.
  SHUTDOWN_WAIT_SECONDS: ${SHUTDOWN_WAIT_SECONDS:-100}
  # Two queues: the api puts a small job (a pasted image, one page: SMALL_JOB_MAX_PAGES) on the fast
  # queue while a fast worker is alive and every other job on the default one. A worker serves the queue
  # named by WORKER_QUEUE_NAME (worker-fast overrides it below); the worker of the default queue also moves
  # jobs stranded on the fast queue back when no fast worker is alive.
  WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME:-arq:queue}
  WORKER_FAST_QUEUE_NAME: ${WORKER_FAST_QUEUE_NAME:-decimer:fast}

# The rest of what worker and worker-fast share (each has its own `environment`, from x-worker-env, and limits).
# depends_on: wait for every replica of seg, cls and ocsr to answer a real inference, so the first jobs after a
# start do not fail. NOT for chem's health: chem is optional for the worker (a job without it has no IUPAC name,
# one warning, and a few seconds of waiting: WorkerSettings.chem_connect_retry_budget_seconds), and it takes the
# JVM a minute to load, so `service_started` only puts it ahead in the start order. A chem that is down never
# keeps the worker from starting or from running jobs (tests/worker/test_chem_down.py; deploy/check-compose.py
# keeps this line honest).
x-worker: &worker
  <<: [*service, *api-image]
  command: ["python", "-m", "decimer_api.worker"]
  env_file: .env
  volumes:
    - jobs:/data/jobs
  networks:
    - backend
    - models
    - glitchtip-sdk
  depends_on:
    redis:
      condition: service_healthy
    seg:
      condition: service_healthy
    cls:
      condition: service_healthy
    ocsr:
      condition: service_healthy
    chem:
      condition: service_started
  healthcheck:
    test: ["CMD", "python", "/usr/local/bin/worker_healthcheck.py"]
    interval: 30s
    timeout: 10s
    start_period: 60s
    retries: 3
  stop_grace_period: 120s

services:
  # --- state ------------------------------------------------------------------------------------
  # Job records, per-client counters and the arq queue. Nothing is persisted, on purpose: every key has
  # a TTL of at most 6 h (a queued job; a finished job 1 h), the job FILES live on a volume and are swept
  # by their own TTL, and a Redis that never writes job data to disk keeps the 1-hour retention promise.
  # The price: a Redis restart drops the queue and every job record. Waiting and running jobs are lost
  # (the client sees 404 and uploads again); their folders on the job volume are swept after
  # SWEEP_GRACE_SECONDS. Redis restarts only with a deploy or a host reboot, which interrupt running
  # jobs anyway. noeviction: when full, writes fail (the API answers 503) rather than losing records.
  # 256 MB holds thousands of job records (about 300 KB each with SVGs and molfiles).
  #
  # Password: REDIS_PASSWORD from deploy/.env, which is also in REDIS_URL of api, worker and sweep. The
  # ingest and render children get a minimal environment without it, so the one thing that stops a
  # parser exploit from talking to Redis is that password (the ingest sidecar in deploy/README.md is
  # the other half). It is handed to Redis on stdin, not in the command line (argv is readable by every
  # user of the VM in the host's process table), and to redis-cli through REDISCLI_AUTH for the
  # healthcheck. Use a hex password (`openssl rand -hex 24`): it goes into a URL and a config line.
  # The image's entrypoint (which starts as root) is replaced, so the container runs as the `redis`
  # user from the start and needs no capabilities.
  redis:
    <<: *redis
    entrypoint:
      - sh
      - -c
      - |
        exec redis-server - <<EOF
        requirepass $$REDIS_PASSWORD
        save ""
        appendonly no
        maxmemory 256mb
        maxmemory-policy noeviction
        tcp-keepalive 60
        EOF
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 1
    pids_limit: 64

  # The usage counter's Redis: per-day counts of jobs by kind and size, pages, structures and failures
  # (decimer_api/usage.py; no address, no job id, no file name), which must survive a restart, unlike everything
  # in `redis`. Append-only file on a volume, fsync every second. Tiny: a day is about twenty small fields and is
  # kept 800 days (USAGE_TTL_DAYS). The api and the worker count into it best effort: while it is down they log a
  # warning and lose that count, never the upload or the job. Same password as `redis` (one secret less); no
  # route from outside `backend`. Read it: `$DC exec api python -m decimer_api.usage --days 30`.
  usage:
    <<: *redis
    entrypoint:
      - sh
      - -c
      - |
        exec redis-server - <<EOF
        requirepass $$REDIS_PASSWORD
        dir /data
        appendonly yes
        appendfsync everysec
        save ""
        maxmemory 32mb
        maxmemory-policy noeviction
        tcp-keepalive 60
        EOF
    volumes:
      - usage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 96m
    memswap_limit: 96m
    cpus: 0.5
    pids_limit: 32

  # --- model services (no route to the internet) --------------------------------------------------
  # Weights and jars are inside the images (SHA-256 checked at build time); no network is needed to
  # start. Healthchecks come from the images (/readyz, which runs a real inference).
  seg:
    <<: *model-service
    image: localhost/decimer-next/seg:${DECIMER_TAG:-local}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/seg.Dockerfile
      args:
        # 1 until deploy/patches/apply-pyproject-patches.sh has been applied to services/seg and ocsr.
        OPENCV_GUI_LIBS: ${OPENCV_GUI_LIBS:-0}
    deploy:
      replicas: ${SEG_REPLICAS:-2}
    environment:
      # Per replica: the compute threads of one replica. The numbers across all replicas are balanced in
      # deploy/README.md ("Replicas, threads and memory"); OMP, OpenBLAS, MKL and numba are held to the same
      # count so the libraries under TensorFlow (numpy, OpenCV's bundled BLAS) do not start one thread
      # per core in every replica.
      TF_NUM_INTRAOP_THREADS: ${SEG_TF_INTRAOP_THREADS:-2}
      TF_NUM_INTEROP_THREADS: ${SEG_TF_INTEROP_THREADS:-1}
      OMP_NUM_THREADS: ${SEG_TF_INTRAOP_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${SEG_TF_INTRAOP_THREADS:-2}
      MKL_NUM_THREADS: ${SEG_TF_INTRAOP_THREADS:-2}
      NUMBA_NUM_THREADS: ${SEG_TF_INTRAOP_THREADS:-2}
      # Pages above this many pixels get a 422 from seg. Do not raise it: the API admits up to 50 MP, and the
      # worker sends seg a smaller copy of every page above SEG_INPUT_MAX_PIXELS (25 MP) or 36 MiB encoded
      # (worker/files.py `fit_png`; the crops are cut from the full page), so no page reaches
      # this cap. It stays as seg's own backstop, and its memory limit is sized for it.
      OPENCV_IO_MAX_IMAGE_PIXELS: ${SEG_MAX_IMAGE_PIXELS:-40000000}
    # PER REPLICA. About 2 GB resident, 3.5 s a page at all cores (services/seg/README.md). Mask memory grows
    # with the page size and the number of detections; 3 GB covers A3 pages at 300 DPI with room to spare.
    # cpus = the thread cap plus half a core for TensorFlow's other threads and the mask-expansion pool
    # (up to 4 short-lived threads). SEG_CPUS does not follow SEG_TF_INTRAOP_THREADS by itself: change
    # both by hand, together (threads + 0.5). SEG_MEM_LIMIT: 3g on linux/amd64; on linux/arm64 (Docker on Apple
    # Silicon) seg holds about 4.2 GiB right after start-up, so it needs 6g there.
    mem_limit: ${SEG_MEM_LIMIT:-3g}
    memswap_limit: ${SEG_MEM_LIMIT:-3g}
    cpus: ${SEG_CPUS:-2.5}
    pids_limit: 512

  cls:
    <<: *model-service
    image: localhost/decimer-next/cls:${DECIMER_TAG:-local}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/cls.Dockerfile
    deploy:
      replicas: ${CLS_REPLICAS:-2}
    environment:
      TF_NUM_INTRAOP_THREADS: ${CLS_TF_INTRAOP_THREADS:-1}
      TF_NUM_INTEROP_THREADS: ${CLS_TF_INTEROP_THREADS:-1}
      OMP_NUM_THREADS: ${CLS_TF_INTRAOP_THREADS:-1}
      OPENBLAS_NUM_THREADS: ${CLS_TF_INTRAOP_THREADS:-1}
      MKL_NUM_THREADS: ${CLS_TF_INTRAOP_THREADS:-1}
      MALLOC_ARENA_MAX: "2"
    # PER REPLICA. About 1 GB resident, 1.9 GB worst case, and RSS grows 57-100 KB per request
    # (services/cls/README.md): the restart policy turns an OOM kill into a short outage. A crop takes
    # about 0.1 s, so one thread is plenty and a replica is idle almost all the time.
    # TODO: soak test of a few thousand requests, then confirm or change this limit.
    mem_limit: 2560m
    memswap_limit: 2560m
    cpus: ${CLS_CPUS:-1.5}
    pids_limit: 256

  # Both DECIMER models are in the image (owner decision D15: the printed one that the service uses and the
  # hand-drawn one that it never loads, 348 MB of disk), but since decimer 2.8.1 only the printed one is in
  # memory. services/ocsr/README.md: about 3.0 GB resident (2.65 after load and selftest, 3.05 after the
  # worst-case request), about 0.46 GB for that request, 0.1 GB of request bodies: 3.6 GB at the very worst
  # PER REPLICA. The limit is 4 GB: 0.4 GB above that worst case, the margin decimer 2.8.0
  # had under its 6 GB (5.6 GB at the very worst, both models loaded). Start-up is about 25 s.
  ocsr:
    <<: *model-service
    image: localhost/decimer-next/ocsr:${DECIMER_TAG:-local}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/ocsr.Dockerfile
      args:
        OPENCV_GUI_LIBS: ${OPENCV_GUI_LIBS:-0}
    deploy:
      replicas: ${OCSR_REPLICAS:-3}
    environment:
      TF_NUM_INTRAOP_THREADS: ${OCSR_TF_INTRAOP_THREADS:-2}
      TF_NUM_INTEROP_THREADS: ${OCSR_TF_INTEROP_THREADS:-1}
      OMP_NUM_THREADS: ${OCSR_TF_INTRAOP_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${OCSR_TF_INTRAOP_THREADS:-2}
      MKL_NUM_THREADS: ${OCSR_TF_INTRAOP_THREADS:-2}
    # PER REPLICA. The transformer decodes token by token, so more threads help little: every replica
    # uses about the cap (deploy/README.md, "Replicas, threads and memory"). cpus follows the cap.
    mem_limit: 4g
    memswap_limit: 4g
    cpus: ${OCSR_CPUS:-2}
    pids_limit: 512

  # Orthonym names (JVM inside). Python 3.12 and a JRE; no network. The service refuses to start if
  # ORTHONYM_ALLOW_REDUCED, ORTHONYM_OPSIN_JAR, ORTHONYM_CENTRES_JAR or ORTHONYM_DISABLE_JPYPE is set,
  # so none is set here. services/chem/README.md: about 360 MB for the naming process (JVM included)
  # and 50 MB for the web process, flat over 1000 names; the heap cap is ORTHONYM_JVM_XMX (512m, in the
  # image). The valid tier is a setting of the service's code, not of the image. One replica: it names
  # about 20 structures per job in tens of milliseconds each.
  chem:
    <<: *model-service
    image: localhost/decimer-next/chem:${DECIMER_TAG:-local}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/chem.Dockerfile
    # models (the worker) and chem-api (the api: validate and export name edited structures).
    networks:
      - models
      - chem-api
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 2
    pids_limit: 256

  # --- the application ---------------------------------------------------------------------------
  # ONE api container running ONE process: the ingest gate and the queue throttle are per process
  # (api/README.md). Never `deploy.replicas`, `--scale api=2` or uvicorn --workers.
  # The command is the exec form, so python is PID 1 and holds the only copy of the environment (it
  # makes itself non-dumpable so its children, same user, cannot read it).
  # UPLOADS AND MOLFILES ARE PARSED IN THE INGEST SIDECAR (service `ingest`, TODO): INGEST_SIDECAR_URL
  # makes the api send them over the `ingest` network instead of starting child processes of its own, so
  # the api itself is about 0.5 GB (about 100 MB resident, the request bodies it spools, and the Python
  # of the routes): API_MEM_LIMIT, 1g. The in-process fallback (development, or a deployment that does not
  # run the sidecar) is INGEST_SIDECAR_URL= (empty) AND API_MEM_LIMIT=4608m: the api then runs up to
  # INGEST_CONCURRENCY (2) ingest children of INGEST_MEMORY_MB (1536) each and MAX_CONCURRENT_ANALYSES (2)
  # molfile children of about 450 MB each, 0.5 + 3.0 + 0.9 = 4.4 GB (4484 MiB), so 4608m, as before.
  # Writable root file system on purpose: starlette spools uploads over 1 MB to a temp file under
  # /tmp, and a RAM-backed /tmp would count those 100 MB against the memory limit.
  api:
    <<: [*service, *api-image]
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    command: ["python", "-m", "decimer_api"]
    env_file: .env
    environment:
      <<: [*reporting-env, *no-glitchtip-secrets]
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env (openssl rand -hex 24)}@redis:6379/0
      DATA_DIR: /data/jobs
      HOST: 0.0.0.0
      PORT: "8000"
      MEDIA_STREAM_DIRECT: "false"
      MEDIA_ACCEL_PREFIX: /_protected/jobs
      # The API's peer is the edge, on the app network: that subnet is all it trusts (it believes the
      # one X-Forwarded-For entry the edge sets). The campus proxies are the EDGE's business, not the API's.
      TRUSTED_PROXY_CIDR: ${APP_SUBNET:-172.29.80.16/28}
      # The same two values the edge uses (edge-entrypoint.sh): proxy_read_timeout and the upload limit.
      PROXY_READ_TIMEOUT_SECONDS: ${PROXY_READ_TIMEOUT_SECONDS:-60}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      # Required: without it counters reset at every restart. `openssl rand -hex 32`. Lives in deploy/.env.
      # Only the api gets it (the worker and the sweep have it blanked below).
      IP_HASH_SECRET: ${IP_HASH_SECRET:?set IP_HASH_SECRET in deploy/.env (openssl rand -hex 32)}
      # The private problem-report volume: `REPORTS_DIR` is the api's own setting.
      REPORTS_DIR: /data/reports
      # The api names an edited structure (validate, export) through chem, alone of the model services, over
      # the `chem-api` network. `-` and not `:-`: `CHEM_URL=` in .env really is empty and switches names off.
      CHEM_URL: ${CHEM_URL-http://chem:8004}
      # The ingest sidecar (below). `-` and not `:-`: `INGEST_SIDECAR_URL=` in .env really is empty and
      # switches back to child processes of the api (and then API_MEM_LIMIT must be 4608m).
      INGEST_SIDECAR_URL: ${INGEST_SIDECAR_URL-tcp://ingest:9000}
      # The two arq queues: the api sends a small job to the fast queue only while a fast worker's
      # health-check key (<WORKER_FAST_QUEUE_NAME>:health-check) exists in Redis, so while worker-fast is
      # not running (stopped, starting, scaled to 0) every job goes to the default queue and the default
      # worker runs it.
      WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME:-arq:queue}
      WORKER_FAST_QUEUE_NAME: ${WORKER_FAST_QUEUE_NAME:-decimer:fast}
    volumes:
      - jobs:/data/jobs
      - reports:/data/reports
    networks:
      - app
      - backend
      - chem-api
      - ingest
      - glitchtip-sdk
    # The api is not ready without its sidecar (/readyz asks it), so it waits for it: the sidecar has no
    # models to load and is healthy within seconds.
    depends_on:
      redis:
        condition: service_healthy
      ingest:
        condition: service_healthy
    # An upload in flight can take INGEST_WAIT_SECONDS (20) + INGEST_TIMEOUT_SECONDS (30) + the
    # request's own time: 70 s lets running requests finish on `docker stop`.
    stop_grace_period: 70s
    # A ZIP download holds a file open per crop while the client reads (MAX_CONCURRENT_DOWNLOADS, 8, at
    # most MAX_STRUCTURES, 20, each = 160) on top of sockets and the ingest children's pipes. The container's
    # default limit is the daemon's; this one is explicit, so that slow readers cannot run the process out.
    ulimits:
      nofile:
        soft: 4096
        hard: 4096
    mem_limit: ${API_MEM_LIMIT:-1g}
    memswap_limit: ${API_MEM_LIMIT:-1g}
    cpus: 2
    pids_limit: 256

  # The ingest sidecar (TODO, the API review's "run ingest in a sidecar"): the api's untrusted-file work in
  # a container of its own. It runs `python -m decimer_api.sidecar`, which starts the same children the api used to
  # (one process per upload with a deadline and hard limits, `INGEST_CONCURRENCY` at a time; a pool of
  # `MAX_CONCURRENT_ANALYSES` long-lived RDKit children for molfiles), so a compromised parser sees one upload
  # on a private scratch volume and not all of DATA_DIR, and has no route to Redis, chem, the edge, GlitchTip
  # or the internet: its only network, `ingest`, holds the api. The uploads travel over the connection (TCP, a
  # length-prefixed protocol: decimer_api/sidecar_wire.py) and the normalised files come back the same way;
  # the api writes them into DATA_DIR itself and checks what it gets (names, sizes, counts).
  #   * No secret: env_file gives it the limits (the same .env as the api, so the two cannot disagree), and the
  #     two secrets in it are blanked. It makes itself non-dumpable like the api.
  #   * read_only root with a small RAM /tmp; the scratch volume (`ingest-scratch`) is disk, because a 50 MP
  #     page is tens of MB and a 100 MB upload is held next to its result. It is emptied after every request and
  #     at start-up is whatever a crash left (the sidecar removes only its own folders: `docker volume rm` it
  #     if a crash ever leaves big ones).
  #   * Memory: 2 ingest children x INGEST_MEMORY_MB (1536) + 2 molfile children x about 450 MB + the server
  #     (about 100 MB) = about 4.0 GB at their limits at the same moment, so 4352m. Resident: about 0.3 GB.
  #   * A compromised child here can still see the other request that is in flight (same user, same scratch
  #     volume): at most INGEST_CONCURRENCY - 1 other uploads, for seconds. That is the price of the design.
  ingest:
    <<: [*service, *api-image]
    command: ["python", "-m", "decimer_api.sidecar"]
    env_file: .env
    environment:
      <<: *no-glitchtip-secrets
      SIDECAR_HOST: 0.0.0.0
      SIDECAR_PORT: "9000"
      SIDECAR_SCRATCH_DIR: /scratch
      # env_file hands over everything in .env: no secret, no reporting, no route to Redis anyway.
      REDIS_PASSWORD: ""
      IP_HASH_SECRET: ""
      SENTRY_DSN: ""
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ingest-scratch:/scratch
    networks:
      - ingest
    healthcheck:
      test: ["CMD", "python", "-m", "decimer_api.sidecar", "--ping"]
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 3
    stop_grace_period: 40s
    mem_limit: ${INGEST_MEM_LIMIT:-4352m}
    memswap_limit: ${INGEST_MEM_LIMIT:-4352m}
    cpus: ${INGEST_CPUS:-2}
    pids_limit: 256

  worker:
    <<: *worker
    environment:
      <<: *worker-env
      # Jobs this process runs at once, so that several jobs' crops interleave on the replicas (D18; a small
      # job's calls go first and jobs take turns, see api/src/decimer_api/worker/replicas.py). About twice
      # the ocsr slots: 4 beside legacy (2 replicas), 8 after cutover (3 replicas). With the fast lane off
      # this is also how many big PDFs can be running before a small job has to wait for a place.
      WORKER_MAX_JOBS: ${WORKER_MAX_JOBS:-4}
    # Up to WORKER_MAX_JOBS jobs; a PDF page is rendered in a child process of about 0.5 GB (a 50 MP page)
    # and up to RENDER_MEMORY_MB (2 GB) of address space, RENDER_CONCURRENCY of them at once. 2 GB beside
    # legacy, 3 GB after cutover (more jobs, two renders at once). TODO: measure on the golden paper.
    mem_limit: ${WORKER_MEM_LIMIT:-2g}
    memswap_limit: ${WORKER_MEM_LIMIT:-2g}
    cpus: ${WORKER_CPUS:-2}
    pids_limit: 256

  # The fast lane (TODO, D18): a second worker on its own arq queue for small jobs (one pasted image
  # or a single small upload, at most one page: SMALL_JOB_MAX_PAGES), so that a small job never waits for a
  # worker place (WORKER_MAX_JOBS) behind 10-page PDFs in the default queue. It is part of the default start
  # (1 GB limit, deploy/README.md "Memory"); to run without it: `$DC up -d --scale worker-fast=0` or
  # `$DC stop worker-fast`. Either is safe: the api sends a job to the fast queue only while this worker is
  # alive (its health-check key is in Redis), so without it small jobs take the default queue and the
  # default worker; a job still WAITING on its queue when it dies is moved to the default queue by the default
  # worker within about 90 s (arq's key lives 61 s; FAST_LANE_RESCUE_SECONDS, 30, is how often it looks), but a
  # job that was RUNNING on it is started again only when arq's in-progress key has expired, job_timeout + 10 s
  # (about 18 minutes with the defaults). It shares the model services with the default worker (a replica
  # serves one call at a time for both); its own limits are small because it only takes small jobs.
  worker-fast:
    <<: *worker
    environment:
      <<: *worker-env
      # The queue this worker serves (the worker reads it), and the variable worker_healthcheck.py builds
      # its health-check key from: <queue name>:health-check, the key arq's worker keeps for its queue.
      WORKER_QUEUE_NAME: ${WORKER_FAST_QUEUE_NAME:-decimer:fast}
      WORKER_MAX_JOBS: ${WORKER_FAST_MAX_JOBS:-2}
    mem_limit: ${WORKER_FAST_MEM_LIMIT:-1g}
    memswap_limit: ${WORKER_FAST_MEM_LIMIT:-1g}
    cpus: ${WORKER_FAST_CPUS:-1}
    pids_limit: 128

  # Deletes the folders of expired jobs (the records expire by themselves in Redis). init: python as
  # PID 1 would ignore SIGTERM (no handler), so `docker stop` would wait for the kill; tini passes it on.
  sweep:
    <<: [*service, *api-image]
    init: true
    command: ["python", "-m", "decimer_api.sweep", "--every", "300"]
    env_file: .env
    environment:
      <<: *no-glitchtip-secrets
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env (openssl rand -hex 24)}@redis:6379/0
      DATA_DIR: /data/jobs
      IP_HASH_SECRET: ""
      SENTRY_DSN: ""   # the sweep does not report (env_file would hand it the DSN)
    volumes:
      - jobs:/data/jobs
    networks:
      - backend
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      disable: true
    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.5
    pids_limit: 64

  # --- error reports: GlitchTip, self-hosted ------------------------------------
  # Crash reports from the api, the worker and the web app go to a GlitchTip on this VM, through the standard
  # Sentry SDKs, so no report leaves Jena. What a report may carry is decimer_api/scrub.py and
  # web/src/observability/scrub.ts (no SMILES, molfile, file name or IP address; tests prove it).
  # GlitchTip 6 needs only itself and Postgres: one container runs the web server and the task worker
  # (`GLITCHTIP_EMBED_WORKER`, a documented mode that GlitchTip's own compose file uses), and with `VALKEY_URL`
  # empty Postgres is the task queue, the cache and the session store (documented: "Set to empty string to
  # disable VALKEY and utilize Postgres"), so there is no Redis in this stack for it. Measured on 2026-10-23 with
  # these settings: 125 MiB resident idle, 169 MiB after 100 events; Postgres 53 and 74 MiB.
  #   * Not public: GlitchTip is on internal networks only. The browsers' reports reach it through one
  #     POST-only location of the edge (one project id, no IP-naming header, 64 KB, no Content-Encoding); the api
  #     and the workers through the `glitchtip-gate` (that one endpoint, nothing else); its UI is on a loopback-only
  #     listener (127.0.0.1:8091, the edge). It has no route to the internet, so it sends no mail
  #     (EMAIL_URL=consolemail://) and does no uptime checks.
  #   * Registration is off, and the first account exists before the web server starts (see `glitchtip` below).
  #   * Retention: GLITCHTIP_RETENTION_DAYS, 90 (its banner at start says "Event retention: 90 days").
  #   * Memory, about 0.5 GB as D21 said: 384m + 160m. GRANIAN_WORKERS_MAX_RSS is set because GlitchTip derives
  #     it from the container limit with a floor of 1 GiB, which is above this limit: a web worker above 224 MiB is
  #     replaced (granian starts the new one before it stops the old, about 130 MiB each: 354 MiB < 384).
  glitchtip-db:
    <<: *service
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    # The image's entrypoint starts as root and drops to postgres, which needs capabilities that cap_drop
    # removes; starting as postgres needs none (the named volume takes the image's ownership at first mount).
    user: postgres
    command:
      - postgres
      # GlitchTip's partitioned tables: a query that cannot be narrowed to one partition locks every partition
      # and index; its install docs say 512.
      - -c
      - max_locks_per_transaction=512
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=96MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=40
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_DB: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:?set GLITCHTIP_DB_PASSWORD in deploy/.env (openssl rand -hex 24)}
    volumes:
      # Postgres 18's image keeps its data in /var/lib/postgresql/18/docker, under this volume.
      - glitchtip-pgdata:/var/lib/postgresql
    networks:
      - glitchtip-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 160m
    memswap_limit: 160m
    cpus: 1
    pids_limit: 64

  # The account is made BEFORE the web server starts (`command`): GlitchTip lets anybody register while it has no
  # user at all (`ENABLE_USER_REGISTRATION or not User.objects.exists()`), however ENABLE_USER_REGISTRATION is set,
  # so the first minutes of a fresh GlitchTip would be a race against whoever else is on its networks. The
  # one-shot is glitchtip-init.py (run through `manage.py shell`, after the migrations and the cache table, which is
  # a table in Postgres here): the superuser of
  # GLITCHTIP_ADMIN_EMAIL / GLITCHTIP_ADMIN_PASSWORD (deploy/.env) when there is no user at all, the organisation
  # `decimer`, its two projects, "scrub IP addresses" on for all of them, and a line per project with the DSN to
  # use (`$DC logs glitchtip | grep DSN`). It is idempotent, never adds an account to a GlitchTip that has one,
  # and if it fails the container stops without starting the web server (`&&`).
  glitchtip:
    <<: *service
    image: glitchtip/glitchtip:6.2.6@sha256:a3d8eb1b36c1e1603d55ab32711ea3dd8115874742a781a57391a62a16e0dff6
    command:
      - sh
      - -c
      - python manage.py migrate --no-input --skip-checks && python manage.py createcachetable && python manage.py shell < /init/glitchtip-init.py && exec ./bin/start.sh
    volumes:
      - ./glitchtip-init.py:/init/glitchtip-init.py:ro
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:?set GLITCHTIP_DB_PASSWORD in deploy/.env (openssl rand -hex 24)}@glitchtip-db:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set GLITCHTIP_SECRET_KEY in deploy/.env (openssl rand -hex 32)}
      GLITCHTIP_ADMIN_EMAIL: ${GLITCHTIP_ADMIN_EMAIL:?set GLITCHTIP_ADMIN_EMAIL in deploy/.env (the operator's e-mail address)}
      GLITCHTIP_ADMIN_PASSWORD: ${GLITCHTIP_ADMIN_PASSWORD:?set GLITCHTIP_ADMIN_PASSWORD in deploy/.env (openssl rand -hex 24)}
      # The address the operator's browser uses for the UI (links, the login's Origin check). The loopback
      # port of the edge; through `ssh -L 8091:127.0.0.1:8091` it is the same.
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://127.0.0.1:8091}
      ALLOWED_HOSTS: ${GLITCHTIP_ALLOWED_HOSTS:-127.0.0.1,localhost,glitchtip}
      # One container for the web server and the task worker; Postgres as queue, cache and sessions.
      GLITCHTIP_EMBED_WORKER: "true"
      VALKEY_URL: ""
      VTASKS_CONCURRENCY: "4"
      GRANIAN_WORKERS: "1"
      GRANIAN_WORKERS_MAX_RSS: "224"
      # No route out: no mail (the alerts show in the UI only), no uptime checks, no log ingestion.
      EMAIL_URL: consolemail://
      DEFAULT_FROM_EMAIL: glitchtip@decimer.ai
      GLITCHTIP_ENABLE_UPTIME: "false"
      GLITCHTIP_ENABLE_LOGS: "false"
      ENABLE_USER_REGISTRATION: "false"
      ENABLE_ORGANIZATION_CREATION: "false"
      # Server-side scrubbing of what is sent (keys such as passwords and tokens, card numbers, key blocks) for
      # every project, as a last line behind the SDKs' own scrubbers. IP addresses are the project's and the
      # organisation's "scrub IP addresses" (glitchtip-init.py turns it on; it is also GlitchTip's default).
      GLITCHTIP_PII_SCRUB_DEFAULT: '{"enabled": true}'
      # Browsers send nothing to GlitchTip from another origin: its UI is the only one (the edge strips the Origin
      # header of the reports, which come from the site's own origin anyway).
      CORS_ORIGIN_ALLOW_ALL: "false"
      CORS_ORIGIN_WHITELIST: ${GLITCHTIP_DOMAIN:-http://127.0.0.1:8091}
      GLITCHTIP_RETENTION_DAYS: ${GLITCHTIP_RETENTION_DAYS:-90}
      LOG_LEVEL: WARNING
    networks:
      - glitchtip-db
      - glitchtip-edge
    depends_on:
      glitchtip-db:
        condition: service_healthy
    # The image's own check (GET /_health/); the first start runs the migrations and takes about 40 s.
    healthcheck:
      test: ["CMD", "python", "/code/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    mem_limit: 384m
    memswap_limit: 384m
    cpus: 1
    pids_limit: 128

  # The only way from the api and the workers to GlitchTip: nginx with nothing but `POST /api/<id>/envelope/`
  # (nginx/glitchtip-gate.conf, mounted as its whole configuration). It is on `glitchtip-sdk` (api, worker,
  # worker-fast: SENTRY_DSN=http://<key>@glitchtip-gate:8000/<project id>) and on `glitchtip-edge` (GlitchTip's side),
  # so a compromised api or worker cannot reach GlitchTip's login, API or admin. Uid 101, read-only root file
  # system, RAM /tmp; the image's entrypoint scripts (they edit /etc/nginx/conf.d) are skipped.
  glitchtip-gate:
    <<: *service
    image: nginx:1.31.8-alpine3.24@sha256:1ef7ca94d7879df82421428ce13bd1eaa412404953859cf7a5b6512c25e67a60
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./nginx/glitchtip-gate.conf:/etc/nginx/nginx.conf:ro
    networks:
      - glitchtip-sdk
      - glitchtip-edge
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 3
    mem_limit: 32m
    memswap_limit: 32m
    cpus: 0.5
    pids_limit: 32

  # nginx: the app, /api/ to the api, job media from the job volume (read-only here), rate limits, and for
  # GlitchTip the endpoint the browsers' error reports go to (/glitchtip/api/<project>/envelope/, POST only)
  # and a second listener with GlitchTip's own UI.
  # Two published ports, both on the loopback interface only (8080 is the legacy site's): the site on
  # 127.0.0.1:8090, and GlitchTip's UI on 127.0.0.1:8091 (EDGE_PORT, GLITCHTIP_PORT): the UI listener is
  # `nginx/glitchtip-ui.conf`, a server of its own that the front door of the public site never forwards to.
  # /var/cache/nginx is a disk-backed volume because the edge buffers uploads (up to 100 MB each) there
  # (proxy_request_buffering stays on); /tmp is RAM and holds only the pid file and a generated include.
  # /var/log/nginx is the edge-logs volume: nginx's ERROR LOG, the one place the edge writes a client address, is
  # a file there (not docker's json-file log, which is bounded by size and not by age) that edge-logs.sh rotates
  # daily and deletes after seven days (nginx/edge-logs.sh; deploy/README.md, "Error log"): the image's
  # HEALTHCHECK runs it every 15 s, so keep the healthcheck. A stopped edge prunes nothing (the next start does,
  # or the one-liner in the README). The access log has no address and goes to stdout as before.
  # The edge reaches the api over `app`; clients and the legacy nginx reach the edge over `public`; GlitchTip
  # over `glitchtip-edge`. It does not wait for GlitchTip: the name is looked up per request.
  edge:
    <<: *service
    image: localhost/decimer-next/edge:${DECIMER_TAG:-local}
    pull_policy: never
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        # `http` is the real client; `mock` gives a UI demo on canned data.
        VITE_API: ${VITE_API:-http}
        # The browser's error reporting: the DSN of GlitchTip's `decimer-web` project, with THIS site's host
        # and /glitchtip/ in it (https://<public key>@decimer.ai/glitchtip/<project id>; the local stack:
        # http://<key>@127.0.0.1:8090/glitchtip/<id>), because the page's CSP lets it talk to its own origin only.
        # Empty: the app carries no error-reporting code at all. Baked in at build time: rebuild to change it.
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_RELEASE: ${DECIMER_TAG:-local}
    environment:
      # The one GlitchTip project the browsers' reports may name (the id in VITE_SENTRY_DSN): edge.conf answers 404
      # for any other, and for all of them while this is empty (edge-entrypoint.sh).
      GLITCHTIP_WEB_PROJECT_ID: ${GLITCHTIP_WEB_PROJECT_ID:-}
      # The proxies whose X-Forwarded-For the edge believes: the public network (the host side of the
      # published port, and the legacy nginx if it is attached) plus the campus proxies from deploy/.env
      # (TODO Q3: empty until their addresses are known; the trailing comma is harmless).
      # PROXY ADDRESSES, NOT CLIENT NETWORKS.
      TRUSTED_PROXY_CIDR: ${PUBLIC_SUBNET:-172.29.80.0/28},${TRUSTED_PROXY_CIDR:-}
      PROXY_READ_TIMEOUT_SECONDS: ${PROXY_READ_TIMEOUT_SECONDS:-60}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
    ports:
      - "127.0.0.1:${EDGE_PORT:-8090}:8080"
      - "127.0.0.1:${GLITCHTIP_PORT:-8091}:8081"
    volumes:
      - jobs:/data/jobs:ro
      - edge-cache:/var/cache/nginx
      - edge-logs:/var/log/nginx
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      public:
        # The name other containers (the legacy nginx, see nginx/beta-front-door.conf.example) use.
        aliases:
          - decimer-next-edge
      app: {}
      glitchtip-edge: {}
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1
    pids_limit: 128

networks:
  public:
    ipam:
      config:
        - subnet: ${PUBLIC_SUBNET:-172.29.80.0/28}
  app:
    internal: true
    ipam:
      config:
        - subnet: ${APP_SUBNET:-172.29.80.16/28}
  backend:
    internal: true
  models:
    internal: true
  # POST /api/jobs/{id}/results/{n}/validate and /export call chem from the api: this network
  # holds the api and chem and nothing else, so the api reaches no other model service.
  chem-api:
    internal: true
  # The ingest sidecar: the api and the sidecar, nothing else.
  ingest:
    internal: true
  # Error reports: the Python SDKs (api, worker, worker-fast) to GlitchTip; the edge to GlitchTip (the
  # browsers' reports and the operator's UI); GlitchTip to its Postgres. Three networks so that no two
  # containers share more than one (see the header: the edge and the api must share `app` alone).
  glitchtip-sdk:
    internal: true
  glitchtip-edge:
    internal: true
  glitchtip-db:
    internal: true

volumes:
  # Job files: written by api, worker (and swept by sweep), read by edge (X-Accel-Redirect). Lives
  # until the sweep deletes a job's folder (1 h after the job ends).
  jobs: {}
  # Problem reports: private, mounted into the api only, never into the edge. Deleted by hand once
  # analysed, and by the api itself when older than REPORTS_MAX_AGE_DAYS (364, hourly). IN NO BACKUP, on purpose: the
  # privacy page says so (TODO must leave this volume out; deploy/README.md, "Backups and retention").
  reports: {}
  edge-cache: {}
  # The edge's error log and its rotated days (at most seven): see the edge service. Not a backup candidate either.
  edge-logs: {}
  # The usage counter's append-only file: small, and the only thing here worth backing up
  #; losing it loses the history of the counts, not the service.
  usage-data: {}
  # GlitchTip's Postgres (error reports of the last 90 days). Not personal data by construction (the scrubber),
  # not worth a backup either; `docker volume rm decimer-next_glitchtip-pgdata` starts a fresh GlitchTip.
  glitchtip-pgdata: {}
  # The ingest sidecar's scratch directory: one folder per request in flight, removed after it.
  ingest-scratch: {}
