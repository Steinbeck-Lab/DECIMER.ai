# Main configuration of the edge image (web.Dockerfile). nginx runs as the unprivileged user `nginx`
# (uid 101) and listens on 8080; compose publishes that on 127.0.0.1 only. Everything specific to
# decimer.ai is in conf.d/edge.conf (this repo: deploy/nginx/edge.conf).

worker_processes 2;
# `stderr` is a special value: nginx writes to fd 2, it does not open a path.
error_log stderr error;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;   # maps .wasm to application/wasm
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    tcp_nopush on;

    # Buffered request bodies (uploads up to 100 MB) and proxy temp files live under
    # /var/cache/nginx, which compose mounts as a disk-backed volume. /tmp is a tmpfs, i.e. RAM,
    # and holds only the pid file and the file edge-entrypoint.sh generates.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;

    include /etc/nginx/conf.d/*.conf;
}
