# GlitchTip's own UI, for the operator: never public. This is an http-level include
# (conf.d/glitchtip-ui.conf of the edge image, next to edge.conf): a server of its own on port 8081, which
# compose publishes on the host's LOOPBACK only (127.0.0.1:${GLITCHTIP_PORT:-8091}). The reverse proxy or front
# door of the public site forwards to port 8080 and never to 8081, so the UI cannot be reached from outside the
# server. Reach it from a workstation with
#     ssh -L 8091:127.0.0.1:8091 <your server>        then        http://127.0.0.1:8091/
# (the login's Origin is checked against the Host header, which this listener passes on as the browser sent
# it; GLITCHTIP_DOMAIN in deploy/.env is only the address GlitchTip puts into links: keep it in step). Registration
# is off in GlitchTip, and the first account is made before its web server starts (glitchtip-init.py).
#
# GlitchTip answers on the `glitchtip-edge` network, which holds this edge, the gate (the api's way in) and
# GlitchTip and nothing else.
# Like the rest of the edge, the name is looked up per request through docker's resolver, so a recreated
# GlitchTip container does not leave nginx with a stale address.
server {
    listen 8081;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $glitchtip_origin http://glitchtip:8000;

    client_max_body_size 10m;
    client_header_timeout 15s;
    client_body_timeout 60s;
    keepalive_timeout 30s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Django compares the Origin of a login with this Host (tested: the same origin is accepted, another is 403).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # A variable and no URI: the request goes on exactly as it came.
        proxy_pass $glitchtip_origin;
    }
}
