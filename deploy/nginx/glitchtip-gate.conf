# The gate between the api and the workers and GlitchTip: the complete nginx.conf of the
# `glitchtip-gate` container. The Python SDKs of the api, worker and worker-fast report to this container
# (SENTRY_DSN=http://<key>@glitchtip-gate:8000/<project id>), not to GlitchTip, so that a compromised api or
# worker can reach ONE thing on GlitchTip: `POST /api/<project id>/envelope/`. Not its login (a place to guess the
# operator's password), not its API, not its admin. The gate is on `glitchtip-sdk` (api, worker, worker-fast) and
# on `glitchtip-edge` (GlitchTip's side); GlitchTip itself is on neither `glitchtip-sdk` nor any network of
# the api's.
#
# Python SDKs send their events gzip-compressed, so unlike the public edge this gate allows a Content-Encoding.
# They come from the stack's own containers, not from browsers: the limits are generous and only there to keep a
# loop in one of them from turning into a flood. No client address is involved (the peer is an internal
# address, which GlitchTip's IP detection ignores as not routable), and nothing is logged.
#
# Runs as uid 101 with a read-only root file system and a RAM /tmp (compose.yaml): every temporary path below
# is under /tmp.

worker_processes 1;
error_log stderr error;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone "gate" zone=gate:1m rate=600r/m;
    limit_req_status 429;

    server {
        listen 8000;
        server_name _;

        client_header_timeout 15s;
        client_body_timeout 30s;
        keepalive_timeout 30s;

        # For the container's health check, and for nothing else.
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        # The one endpoint the Python SDKs use. Anything else, including a GET, is refused here and never
        # reaches GlitchTip.
        location ~ "^/api/(?<gt_project>[0-9]{1,9})/envelope/$" {
            limit_except POST { deny all; }
            limit_req zone=gate burst=100 nodelay;
            client_max_body_size 1m;
            proxy_request_buffering on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host glitchtip;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            set $glitchtip_origin http://glitchtip:8000;
            # Built from the captured id, never the raw request line: nginx matches the normalised path, and a
            # raw path with encoded "../" could be routed elsewhere by GlitchTip.
            proxy_pass $glitchtip_origin/api/$gt_project/envelope/$is_args$args;
        }

        location / {
            return 404;
        }
    }
}
