# Security headers, included in the server block and again in every location that sets its own
# add_header (nginx drops the inherited add_header directives as soon as a location has one).
#
# The Content-Security-Policy is exactly CONTENT_SECURITY_POLICY in web/vite.config.ts, which
# `vite preview` serves to the end-to-end tests; keep the two identical (nothing in scripts/check.sh
# compares them: run `python3 -I deploy/nginx/check-csp.py`). 'wasm-unsafe-eval' is for Ketcher's Indigo
# WASM, worker-src blob: for its worker, style-src 'unsafe-inline' for Mantine and Ketcher's emotion
# styles (docs/DECISIONS.md D8). Adding Matomo or Sentry/GlitchTip to the SPA means adding
# their origins to connect-src (and img-src for Matomo) here AND in vite.config.ts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# Strict-Transport-Security is left to whoever terminates TLS (the campus proxy); this edge speaks
# plain http. Once decimer.ai is https-only everywhere, it may be added here:
# add_header Strict-Transport-Security "max-age=31536000" always;
