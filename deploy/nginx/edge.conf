# decimer.ai edge: serves the React app, proxies /api/ to the job API and hands job media
# to nginx for delivery. This file is an http-level include (conf.d/edge.conf of the edge image, see
# web.Dockerfile and nginx.conf); it holds a few http-level directives and one server block.
#
# What the file relies on at run time:
#   * /tmp/edge-generated.conf, written by edge-entrypoint.sh from TRUSTED_PROXY_CIDR,
#     PROXY_READ_TIMEOUT_SECONDS and MAX_UPLOAD_MB (set_real_ip_from lines, proxy_read_timeout,
#     client_max_body_size and the $max_upload_mb variable).
#   * /etc/nginx/snippets/security-headers.conf (the CSP and friends).
#   * the job volume at /data/jobs, read-only (compose.yaml).
#   * docker's embedded DNS (127.0.0.11) to find the `api` container at request time, so a recreated
#     api container does not leave nginx holding its old address.

# ---------------------------------------------------------------------------------------------
# Logging. Job ids are bearer tokens (whoever has one can read the job) and client addresses are
# personal data the API deliberately keeps only as a keyed hash, so neither goes into the access
# log: no $remote_addr, no query string, ids replaced by ":id", no user agent, no referrer. nginx's error
# log, at level "error", can name the client address, the request line (so a job id and any query
# string), the host and the referrer, for ANY server error: a failed proxy attempt, an upload over the
# size limit, a media file that cannot be opened. It is the one place this server writes an address, and
# the privacy page says it is kept seven days at most: nginx.conf writes it to a FILE on the
# edge-logs volume, and edge-logs.sh (started by edge-entrypoint.sh, enforced by the image's HEALTHCHECK)
# rotates it daily and deletes it after seven days. Do not add a second error_log to stderr: docker's
# log driver would keep those lines by size, not by age.
# Rate-limit refusals are logged at "warn", which nginx.conf's `error_log ... error` hides, and show up
# as 429s in the access log instead.
# ---------------------------------------------------------------------------------------------
map $uri $log_uri {
    "~^(?<pre>/api/jobs|/_protected/jobs)/[0-9a-f]{32}(?<post>/.*)?$"  "$pre/:id$post";
    default                                                            $uri;
}
log_format edge '$time_iso8601 $request_method $log_uri $status $request_time $body_bytes_sent';
access_log /dev/stdout edge;

# ---------------------------------------------------------------------------------------------
# Compression. The build precompresses its text assets (gzip -9, served by gzip_static). brotli is
# not in the official nginx image, so there is no brotli_static; gzip_types must name application/wasm
# (nginx's default list does not) because Ketcher's Indigo WASM is 11.8 MB (3.85 MB gzipped).
# Dynamic gzip is for the API's JSON, which carries SVGs. woff and woff2 are already compressed.
# ---------------------------------------------------------------------------------------------
gzip on;
gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
           application/xml image/svg+xml application/wasm image/x-icon;

# ---------------------------------------------------------------------------------------------
# Per-client limits, keyed by the REAL client address (after the realip module below; the zone key
# is $binary_remote_addr). Behind the campus proxy that is only true while set_real_ip_from lists
# exactly the proxies: see TRUSTED_PROXY_CIDR in deploy/.env.example. IPv6 clients are counted per
# address here (the API counts jobs per /64).
#   api_general  everything under /api/: polling every 2 s, plus the burst of ~30 media requests when
#                a finished job is shown (20 crops, 10 pages), plus one validate call per edit.
#   api_upload   POST /api/jobs only. The API already allows 2 active jobs per client; this keeps a
#                client from making nginx and the ingest children work on a flood of big uploads.
# Refusals are 429 with the API's JSON error shape (see the named locations at the end).
# ---------------------------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_upload:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=api_conn:10m;
limit_conn_zone $binary_remote_addr zone=upload_conn:10m;
# Browser error reports to GlitchTip (the `/glitchtip/api/<project>/envelope/` location below): a crash loop in
# one browser must not fill GlitchTip, nor many browsers together (the second zone has one key for everybody).
limit_req_zone $binary_remote_addr zone=glitchtip_ingest:1m rate=30r/m;
limit_req_zone "glitchtip" zone=glitchtip_all:1m rate=120r/m;
limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- real client address ---------------------------------------------------------------
    # set_real_ip_from lines (the proxies in front of this server) come from TRUSTED_PROXY_CIDR, which
    # compose builds as: the `public` network's subnet (compose.yaml pins it) plus the campus proxies
    # from deploy/.env. Connections through the published port 127.0.0.1:8090, and from another
    # container on `public` (the legacy nginx during the beta), come from an address in that subnet.
    # IT MUST LIST PROXY ADDRESSES, NOT CLIENT NETWORKS: every host inside a listed network can put
    # any address into X-Forwarded-For and so choose the identity its limits are counted against.
    # The campus proxy's address(es) are still TODO Q3: until they are listed, every client behind it
    # shares one limit, because the proxy is then the rightmost address that is not trusted.
    # The generated include also sets proxy_read_timeout (PROXY_READ_TIMEOUT_SECONDS, the same value
    # the API validates its ingest budget against: INGEST_WAIT_SECONDS + child deadline + 5 s) and
    # client_max_body_size (MAX_UPLOAD_MB + 1 MB: the upload limit; /api/ below lowers it for everything
    # but the upload) with the variable $max_upload_mb used in the 413 message.
    include /tmp/edge-generated.conf;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/snippets/security-headers.conf;

    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 30s;

    # --- the API ---------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_origin http://api:8000;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # One entry: the real client address as established above. A client-supplied X-Forwarded-For is
    # discarded; the API trusts this header only from this container (its TRUSTED_PROXY_CIDR is the
    # `app` network, APP_SUBNET in compose.yaml) and takes the rightmost address outside that list.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    # (proxy_read_timeout: generated, above.)
    proxy_buffer_size 16k;
    proxy_buffers 8 32k;
    proxy_max_temp_file_size 0;   # stream responses (the export ZIP) instead of spooling them to disk

    # Health of the edge itself (the container healthcheck) and of the API behind it (an uptime
    # check can use this one; it answers {"status":"ready"} only when Redis answers and DATA_DIR
    # is writable).
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }
    location = /readyz {
        access_log off;
        # Public like everything else here: rate-limited per client, so it cannot be used to hammer
        # redis and the disk check behind it.
        limit_req zone=api_general burst=10 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass $api_origin/readyz;
    }

    # --- browser error reports ---------------------------------------------
    # The app posts its crash reports to its own origin, so the CSP's connect-src stays 'self'
    # (web/src/observability/sentry.ts; its DSN is https://<key>@<this host>/glitchtip/<project>). This
    # location hands them to GlitchTip, on the `glitchtip-edge` network, and is closed in every way it can be:
    #   * POST of an envelope to ONE project id (GLITCHTIP_WEB_PROJECT_ID -> $glitchtip_web_project, generated
    #     by edge-entrypoint.sh; empty = every id is 404) and nothing else: GlitchTip's API, login and admin are
    #     not reachable from here, its UI is on a listener of its own that is published on the loopback only
    #     (glitchtip-ui.conf);
    #   * no Content-Encoding (a compressed body is how a small request becomes a large one), at most 64 KB, and
    #     two rate limits: per client, and for all clients together (a constant key), so that nobody can fill
    #     GlitchTip's disk with reports;
    #   * GlitchTip is sent ONLY the headers it needs (proxy_pass_request_headers off, then the four below): none
    #     that names the sender. python-ipware, which GlitchTip uses to find a client address, reads
    #     X-Forwarded-For, X-Real-IP, Client-IP, X-Forwarded, X-Cluster-Client-IP, Forwarded-For and Forwarded
    #     (and more), and would store what they say for 90 days; with none of them it sees the edge's own
    #     private address and stores no address at all. (deploy/README.md, "Observability"; the test
    #     api/tests/test_glitchtip_edge.py holds this list.) No cookie, no Authorization, no Origin, no User-Agent.
    # (The access log above has no query string, which carries the project's public key.)
    location ~ "^/glitchtip/api/(?<gt_project>[0-9]{1,9})/envelope/$" {
        limit_except POST { deny all; }
        if ($gt_project != $glitchtip_web_project) { return 404; }
        if ($http_content_encoding != "") { return 415; }
        limit_req zone=glitchtip_ingest burst=20 nodelay;
        limit_req zone=glitchtip_all burst=30 nodelay;
        client_max_body_size 64k;   # an event with its stack is a few KB
        proxy_request_buffering on;
        proxy_pass_request_headers off;
        proxy_set_header Connection "";
        proxy_set_header Host glitchtip;
        proxy_set_header Content-Type $content_type;
        proxy_set_header Content-Length $content_length;
        proxy_pass http://glitchtip:8000/api/$gt_project/envelope/$is_args$args;
    }

    # Job creation: the one big request. proxy_request_buffering stays ON (nginx's default, written
    # out so nobody turns it off): the API then sees the request only after nginx has the whole
    # upload, so a client's job slot is held for the ingest, not for a slow upload, and a slow client
    # cannot tie up an ingest turn. The buffered body goes to /var/cache/nginx/client_temp.
    # The body limit is the server-level client_max_body_size from the generated include: MAX_UPLOAD_MB
    # plus 1 MB for multipart framing, so the API makes the call on the files' size and answers with its
    # own message. (nginx would answer 413 for a body of exactly 100 MiB of files.)
    # limit_req / limit_conn run before the body is read, so a refused client costs almost nothing.
    location = /api/jobs {
        limit_req zone=api_upload burst=5 nodelay;
        limit_conn upload_conn 4;
        limit_req zone=api_general burst=60 nodelay;
        client_body_buffer_size 128k;
        proxy_request_buffering on;
        proxy_pass $api_origin$request_uri;
    }

    # Everything else under /api/: status polling, media (X-Accel-Redirect), validate, export, report.
    # `$request_uri` is the request exactly as the client sent it, so nothing is decoded or rewritten
    # on the way (no header injection through %0d%0a).
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_conn api_conn 30;
        client_max_body_size 1m;   # molfiles and report texts; only the upload is big
        proxy_request_buffering on;
        proxy_pass $api_origin$request_uri;
    }

    # The API answers a media request with an empty body and X-Accel-Redirect: /_protected/jobs/<id>/<name>
    # (settings MEDIA_ACCEL_PREFIX); nginx then serves the file from the job volume. `internal` makes
    # the location unreachable from outside, so job files are served only through the API's checks
    # (job exists and is live, name is crop-<n>.png or page-<n>.png). disable_symlinks is the second
    # lock: a symlink anywhere in the path is refused, in case one ever appears in a job folder.
    # The API's own headers (Cache-Control: private, no-store) are kept by nginx; nosniff is not, so
    # it is set here (through the security snippet).
    location /_protected/jobs/ {
        internal;
        alias /data/jobs/;
        disable_symlinks on;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # --- the app ---------------------------------------------------------------------------
    # index.html names the hashed asset files, so it must always be revalidated.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Vite puts a content hash into every file name under assets/ (JS, CSS, fonts, images and the
    # Ketcher .wasm), so they never change under the same name: cache for a year. A missing file is a
    # real 404, never index.html (a stale page asking for a gone chunk must not receive HTML as JS).
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Old links to the Laravel site's pages. The app uses a hash router, so its pages are #/about,
    # #/privacy and #/impressum; the target is relative, so it also works under /beta/.
    location = /about          { return 302 ./#/about; }
    location = /privacy_policy { return 302 ./#/privacy; }
    location = /impressum      { return 302 ./#/impressum; }

    # Anything else in the build root (favicon, robots.txt, ...) is not hashed: an hour.
    # There is no history-router fallback to index.html on purpose: the app has one real URL, /.
    # (If a history router is ever adopted, replace `=404` by `/index.html` and keep the /assets/
    # location above, which must stay a hard 404.)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    # --- errors nginx makes itself, in the API's error shape ----------------------------------
    # {"detail": {"code": ..., "message": ...}}, so the SPA has one error path. Errors that come from
    # the API (including its own 413, 429 and 503) pass through untouched.
    error_page 413 = @err_too_large;
    error_page 429 = @err_rate_limited;
    error_page 502 503 504 = @err_unavailable;

    location @err_too_large {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        # The API's own wording for the same condition, with the limit from MAX_UPLOAD_MB.
        return 413 '{"detail":{"code":"too_large","message":"The upload is too large. The limit is $max_upload_mb MB in total."}}';
    }
    location @err_rate_limited {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        return 429 '{"detail":{"code":"rate_limited","message":"Too many requests. Please wait a few seconds and try again."}}';
    }
    location @err_unavailable {
        default_type application/json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
        return 503 '{"detail":{"code":"unavailable","message":"The service is temporarily unavailable. Please retry in a moment."}}';
    }
}
