[project]
name = "decimer-api"
version = "0.1.0"
description = "FastAPI job API and arq worker for decimer.ai"
readme = "README.md"
authors = [
    { name = "Kohulan Rajan", email = "kohulan.rajan@uni-jena.de" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Exact pins on purpose (ROADMAP §3); uv.lock holds the transitive set.
    "arq==0.28.0",
    "fastapi==0.159.1",
    "httpx==0.28.1",
    "pillow==13.0.0",
    "pillow-heif==1.8.1",
    "pydantic-settings==2.16.1",
    "pypdfium2==5.14.0",
    "python-multipart==0.0.32",
    "rdkit==2026.9.1",
    "redis==5.3.1",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.mypy]
strict = true
packages = ["decimer_api"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# pypdfium2 and RDKit ship no type information.
module = ["pypdfium2.*", "rdkit", "rdkit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = '-m "not slow"'
# A slot or task leak must fail a test, not hang the run.
timeout = 60
markers = [
    "slow: runs the real pipeline against real local model services (SEG_URL, CLS_URL, OCSR_URL); select with -m slow",
]

[dependency-groups]
dev = [
    "fakeredis[lua]==2.40.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.1",
]
