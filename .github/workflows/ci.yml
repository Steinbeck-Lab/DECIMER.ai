name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs; the comment names the release.
jobs:
  python:
    name: python (${{ matrix.project }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [api, services/common, services/seg, services/ocsr, services/cls, services/chem, golden]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.5"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      # The web app's types come from the API's OpenAPI schema (web/src/api/openapi.json). Fails when the API's
      # schema changed and the committed copy did not: run "npm run gen:api" in web/ and commit. No Node needed.
      - if: matrix.project == 'api'
        shell: bash # with pipefail: a failing export fails the step
        run: uv run python ../web/scripts/export-openapi.py | diff - ../web/src/api/openapi.json

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # generated.ts against the committed schema (Node only). The schema against the API itself is checked in the
      # python (api) job above, and by "npm run check:api" with uv and the API's environment.
      - run: node scripts/gen-api.mjs --check --types-only
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npx playwright test
        env:
          HOME: /root
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: web/test-results

  trivy:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # api and web must stay clean; model services are frozen at TF 2.15.1,
          # so their findings are reported but do not fail CI (ROADMAP §3).
          - { path: api, exit-code: "1" }
          - { path: web, exit-code: "1" }
          - { path: services, exit-code: "0" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.path }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ matrix.exit-code }}
