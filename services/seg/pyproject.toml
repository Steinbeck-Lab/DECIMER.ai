[project]
name = "decimer-seg"
version = "0.1.0"
description = "DECIMER Segmentation model service"
readme = "README.md"
authors = [
    { name = "Kohulan Rajan", email = "kohulan.rajan@uni-jena.de" }
]
requires-python = "==3.11.*"
dependencies = [
    "decimer-segmentation==1.6.0",
    "decimer-service",
    "numpy==1.26.3",
    "opencv-python-headless==4.11.0.86",
    "protobuf==4.25.9",
    "tensorflow==2.15.1",
    # Linux arm64 only (e.g. Docker on Apple Silicon): tensorflow's aarch64 wheel is an empty wrapper around
    # tensorflow-cpu-aws. uv locks a version's dependencies from one wheel's metadata, and here it took a macOS
    # wheel's, which lacks the tensorflow-cpu-aws requirement that the Linux and Windows wheels declare.
    "tensorflow-cpu-aws==2.15.1 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.mypy]
strict = true
packages = ["decimer_seg"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "tensorflow", "tensorflow.*", "decimer_segmentation", "decimer_segmentation.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = '-m "not slow"'
markers = [
    "slow: runs the real Mask R-CNN on rendered pages of the golden PDF, in process and in a service process of its own under concurrent requests (CPU, about 100 s); select with -m slow",
]

[tool.uv]
# The service imports cv2 but never opens a window. opencv-python also needs libGL.so.1 and
# libglib2.0-0 at import time; the headless wheel does not, so the runtime image needs no apt
# packages. decimer-segmentation declares opencv-python, so it is excluded from the resolution
# (not locked at all), and the headless wheel, pinned to the version that was locked before (the
# two wheels share a version scheme), is a direct dependency instead. Not an override with a marker
# that never matches: that leaves an sdist-only opencv-python entry in uv.lock, which every later
# `uv lock` has to build to read its metadata.
exclude-dependencies = ["opencv-python"]
# The project's own build backend is pinned too (deploy/patches): `uv sync --no-editable` builds
# decimer-seg and decimer-service from source in an isolated environment, and without this uv takes
# the newest uv-build that [build-system] allows. CI uses 0.13.5. decimer-segmentation itself is a
# wheel from PyPI (1.6.0), so no third-party build backend runs at install time.
build-constraint-dependencies = [
    "uv-build==0.13.5",
]

[tool.uv.sources]
decimer-service = { path = "../common", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pillow>=13.0.0",
    "pymupdf>=2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
