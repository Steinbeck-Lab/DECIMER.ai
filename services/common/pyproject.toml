[project]
name = "decimer-service"
version = "0.1.0"
description = "Shared HTTP skeleton for the DECIMER model services (healthz, readyz, bounded /infer, JSON logs)"
readme = "README.md"
authors = [
    { name = "Kohulan Rajan", email = "kohulan.rajan@uni-jena.de" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.159.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
packages = ["decimer_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
