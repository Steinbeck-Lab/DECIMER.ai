[project]
name = "decimer-chem"
version = "0.1.0"
description = "IUPAC names from Orthonym (default tier, OPSIN round trip) behind a small HTTP service"
readme = "README.md"
authors = [
    { name = "Kohulan Rajan", email = "kohulan.rajan@uni-jena.de" }
]
requires-python = "==3.12.*"
dependencies = [
    "decimer-service",
    "fastapi==0.159.1",
    "orthonym",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S604"]
"scripts/**" = ["S101", "S603", "S607"]

[tool.mypy]
strict = true
packages = ["decimer_chem"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["orthonym", "orthonym.*", "jpype", "jpype.*", "rdkit", "rdkit.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = '-m "not slow"'
markers = [
    "slow: runs the real Orthonym engine in a JVM (needs a Java 11+ runtime and the OPSIN and centres jars); select with -m slow",
]

[tool.uv]
# Build backends are pinned too (deploy/patches). Orthonym is built from source at
# install time (hatchling with a build hook), in an isolated environment. Without this uv takes
# the newest hatchling and its dependencies on PyPI that day and runs it. Versions: the newest releases
# that were two weeks old on 2026-10-22. uv-build is the project's own backend (CI uses 0.13.5).
build-constraint-dependencies = [
    "hatchling==1.32.4",
    "pathspec==1.1.1",
    "pluggy==1.6.0",
    "trove-classifiers==2026.9.21.13",
    "packaging==26.3",
    "uv-build==0.13.5",
]

[tool.uv.sources]
decimer-service = { path = "../common", editable = true }
orthonym = { git = "https://github.com/Steinbeck-Lab/Orthonym", rev = "110ed8153b365973ad90c518a3ea96fbebb13c8b" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.uv.extra-build-variables]
orthonym = { ORTHONYM_SKIP_JAR_PREFETCH = "1" }
